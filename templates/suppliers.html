<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartStockX - Supplier Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --lsu-purple: #461D7C;
      --lsu-gold: #FDD023;
    }

    body {
      display: flex;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
    }

    .sidebar {
      width: 240px;
      background: var(--lsu-purple);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 0;
    }

    .sidebar h4 {
      text-align: center;
      font-weight: bold;
      padding: 0 20px;
      margin-bottom: 30px;
    }

    .sidebar .nav-link {
      color: white;
      font-size: 16px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.3s;
    }

    .sidebar .nav-link:hover,
    .sidebar .nav-link.active {
      background-color: var(--lsu-gold);
      color: var(--lsu-purple);
      font-weight: bold;
      border-radius: 5px;
    }

    .main {
      flex-grow: 1;
      padding: 30px;
    }

    .dashboard-title {
      background-color: var(--lsu-purple);
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      font-size: 1.5rem;
      margin-bottom: 25px;
    }

    .table thead {
      background-color: var(--lsu-gold);
      color: var(--lsu-purple);
    }

    .modal-header.bg-warning {
      background-color: var(--lsu-gold) !important;
      color: var(--lsu-purple);
    }

    .modal-header.bg-primary {
      color: white;
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <div>
      <h4><i class="bi bi-box"></i> SmartStockX</h4>
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="Dashboard"><i class="bi bi-house-door"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="products"><i class="bi bi-box-seam"></i> Products</a></li>
        <li class="nav-item"><a class="nav-link active" href="suppliers"><i class="bi bi-truck"></i> Suppliers</a></li>
        <li class="nav-item"><a class="nav-link" href="supplierdetail"><i class="bi bi-link-45deg"></i> Supplier
            Details</a></li>
        <li class="nav-item"><a class="nav-link" href="User"><i class="bi bi-person"></i> Users</a></li>
      </ul>
    </div>
    <div class="bottom-links px-3">
      <hr class="text-white" />
      <a class="nav-link" href="settings"><i class="bi bi-gear"></i> Settings</a>
      <a class="nav-link text-danger" href="#"><i class="bi bi-box-arrow-right"></i> Sign Out</a>
    </div>
  </div>

  <div class="main">
    <div class="dashboard-title">🚚 Supplier Management</div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="text-dark">Supplier List</h4>
      <button class="btn btn-warning text-dark fw-bold" data-bs-toggle="modal" data-bs-target="#addSupplierModal">
        <i class="bi bi-plus-circle"></i> Add Supplier
      </button>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-hover text-center align-middle bg-white">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Contact</th>
            <th>Website</th>
            <th>Created At</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="supplier-table-body">
          <!-- dynamic rows will go here -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Add Supplier Modal -->
  <div class="modal fade" id="addSupplierModal" tabindex="-1" aria-labelledby="addSupplierLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="addSupplierForm">
        <div class="modal-header bg-warning">
          <h5 class="modal-title">Add Supplier</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="text" class="form-control mb-2" name="name" placeholder="Name" required>
          <input type="text" class="form-control mb-2" name="contact" placeholder="Contact Info" required>
          <input type="url" class="form-control mb-2" name="website" placeholder="Website">
          <input type="datetime-local" class="form-control mb-2" name="created" placeholder="Created At">
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Add Supplier</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const tbody = document.getElementById("supplier-table-body");

    // Function to render suppliers in the table
    function renderSuppliers(data) {
      tbody.innerHTML = "";
      data.forEach(supplier => {
        const row = document.createElement("tr");
        row.innerHTML = `
        <td>${supplier.SupplierID}</td>
        <td>${supplier.Name}</td>
        <td>${supplier.Contact}</td>
        <td><a href="${supplier.Website}" target="_blank">${supplier.Website}</a></td>
        <td>${supplier.CreatedAt || "-"}</td>
        <td>
          <button class="btn btn-sm btn-danger" onclick="deleteSupplier(${supplier.SupplierID})">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      `;
        tbody.appendChild(row);
      });
    }

    // Function to load all suppliers from the backend
    async function loadSuppliers() {
      try {
        const res = await fetch('/api/suppliers');
        if (!res.ok) throw new Error('Failed to fetch suppliers');
        const data = await res.json();
        renderSuppliers(data);
      } catch (err) {
        console.error(err);
        alert('Error loading suppliers.');
      }
    }

    // Handle form submission for adding a supplier
    document.getElementById("addSupplierForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;

      // Build payload with clean keys (Name, Contact, Website)
      const payload = {
        Name: form.name.value.trim(),
        Contact: form.contact.value.trim(),
        Website: form.website.value.trim()
      };

      // Basic validation
      if (!payload.Name) {
        alert("Supplier name is required.");
        return;
      }

      try {
        const res = await fetch('/api/add-supplier', {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const text = await res.text(); // catch non-JSON
        console.log("Raw response:", text);

        let result;
        try {
          result = JSON.parse(text);
        } catch (e) {
          console.error("Not JSON!", text);
          alert('Error: Response was not JSON. Check backend.');
          return;
        }

        if (res.ok) {
          alert(result.message);
          form.reset();
          bootstrap.Modal.getInstance(document.getElementById("addSupplierModal")).hide();
          loadSuppliers();  // Refresh table
        } else {
          alert(result.message || 'Error adding supplier.');
        }
      } catch (err) {
        console.error(err);
        alert('Error adding supplier.');
      }
    });

    // Function to delete a supplier
    async function deleteSupplier(id) {
      if (!confirm("Are you sure you want to delete this supplier?")) return;

      try {
        const res = await fetch(`/api/delete-supplier/${id}`, {
          method: "DELETE"
        });
        const result = await res.json();

        if (res.ok) {
          alert(result.message);
          loadSuppliers();  // Refresh table
        } else {
          alert(result.message || 'Error deleting supplier.');
        }
      } catch (err) {
        console.error(err);
        alert('Error deleting supplier.');
      }
    }

    // Load suppliers when the page is ready
    window.addEventListener("DOMContentLoaded", loadSuppliers);
  </script>

</body>

</html>
