<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartStockX - Supplier Product Pricing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --lsu-purple: #461D7C;
      --lsu-gold: #FDD023;
    }

    body {
      display: flex;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
    }

    .sidebar {
      width: 240px;
      background: var(--lsu-purple);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 0;
    }

    .sidebar h4 {
      text-align: center;
      font-weight: bold;
      padding: 0 20px;
      margin-bottom: 30px;
    }

    .sidebar .nav-link {
      color: white;
      font-size: 16px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.3s;
    }

    .sidebar .nav-link:hover,
    .sidebar .nav-link.active {
      background-color: var(--lsu-gold);
      color: var(--lsu-purple);
      font-weight: bold;
      border-radius: 5px;
    }

    .main {
      flex-grow: 1;
      padding: 30px;
    }

    .dashboard-title {
      background-color: var(--lsu-purple);
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      font-size: 1.5rem;
      margin-bottom: 25px;
    }

    .table thead {
      background-color: var(--lsu-gold);
    }

    .modal-header.bg-warning {
      background-color: var(--lsu-gold) !important;
      color: var(--lsu-purple);
    }
  </style>
</head>

<body>

  <div class="sidebar">
    <div>
      <h4><i class="bi bi-box"></i> SmartStockX</h4>
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link" href="Dashboard"><i class="bi bi-house-door"></i> Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="products"><i class="bi bi-box-seam"></i> Products</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="suppliers"><i class="bi bi-truck"></i> Suppliers</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="supplierdetail"><i class="bi bi-link-45deg"></i> Supplier Details</a>
        </li>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="User"><i class="bi bi-person"></i> Users</a>
        </li>
      </ul>
    </div>
    <div class="bottom-links px-3">
      <hr class="text-white" />
      <a class="nav-link" href="settings"><i class="bi bi-gear"></i> Settings</a>
      <a class="nav-link text-danger" href="#"><i class="bi bi-box-arrow-right"></i> Sign Out</a>
    </div>
  </div>

  <div class="main">
    <div class="dashboard-title">🔗 Supplier-Product</div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="text-dark">Suppliers & Products</h4>
    </div>

    <div class="input-group mb-3">
      <input type="text" id="searchInput" class="form-control" placeholder="Type to search...">
    </div>

    <div class="table-responsive">
      <table id="supplierTable" class="table table-bordered table-hover align-middle text-center bg-white">
        <thead>
          <tr>
            <th>ID</th>
            <th>Supplier Name</th>
            <th>Product Name</th>
            <th>CreatedAt</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="supplier-detail-table-body"></tbody>
      </table>
    </div>
    <script>
      const tbody = document.getElementById("supplier-detail-table-body");

      // 1. Render SupplierDetails Table
      function renderSupplierDetails(data) {
        tbody.innerHTML = "";
        data.forEach(s => {
          const row = document.createElement("tr");
          row.innerHTML = `
      <td>${s.SupplierDetailID}</td>
      <td>${s.SupplierName}</td>
      <td>${s.ProductName}</td>
      <td>${s.CreatedAt || '-'}</td>
      <td>
        <button class="btn btn-sm btn-danger delete-btn" data-id="${s.SupplierDetailID}"><i class="bi bi-trash"></i></button>
      </td>
    `;
          tbody.appendChild(row);
        });
      }

      // 2. Load SupplierDetails from API
      async function loadSupplierDetails() {
        const res = await fetch('/api/supplierdetail');
        const data = await res.json();
        renderSupplierDetails(data);
      }

      window.addEventListener("DOMContentLoaded", () => {
        loadSupplierDetails();

        // 3. Search Filter (added here)
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
          searchInput.addEventListener('keyup', function () {
            const filter = this.value.toLowerCase();
            const rows = tbody.querySelectorAll('tr');
            rows.forEach(row => {
              const text = row.textContent.toLowerCase();
              row.style.display = text.includes(filter) ? '' : 'none';
            });
          });
        }
      });

      // 4. Delete SupplierDetail Entry
      tbody.addEventListener('click', async function (e) {
        const btn = e.target.closest('button');
        if (!btn) return;

        const detailId = btn.dataset.id;

        if (btn.classList.contains('delete-btn')) {
          if (confirm('Are you sure you want to delete this entry?')) {
            const res = await fetch(`/api/delete-supplierdetail/${detailId}`, { method: 'DELETE' });
            const result = await res.json();
            alert(result.message);
            loadSupplierDetails(); // Refresh table
          }
        }
      });

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
