<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartStockX - User Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --lsu-purple: #461D7C;
      --lsu-gold: #FDD023;
    }

    body {
      display: flex;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
    }

    .sidebar {
      width: 240px;
      background: var(--lsu-purple);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 0;
    }

    .sidebar h4 {
      text-align: center;
      font-weight: bold;
      padding: 0 20px;
      margin-bottom: 30px;
    }

    .sidebar .nav-link {
      color: white;
      font-size: 16px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.3s;
    }

    .sidebar .nav-link:hover,
    .sidebar .nav-link.active {
      background-color: var(--lsu-gold);
      color: var(--lsu-purple);
      font-weight: bold;
      border-radius: 5px;
    }

    .main {
      flex-grow: 1;
      padding: 30px;
    }

    .dashboard-title {
      background-color: var(--lsu-purple);
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      font-size: 1.5rem;
      margin-bottom: 25px;
    }

    .table thead {
      background-color: var(--lsu-gold);
      color: var(--lsu-purple);
    }

    .modal-header.bg-warning {
      background-color: var(--lsu-gold) !important;
      color: var(--lsu-purple);
    }

    .modal-header.bg-primary {
      color: white;
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <div>
      <h4><i class="bi bi-box"></i> SmartStockX</h4>
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link" href="Dashboard"><i class="bi bi-house-door"></i> Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="products"><i class="bi bi-box-seam"></i> Products</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="suppliers"><i class="bi bi-truck"></i> Suppliers</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="supplierdetail"><i class="bi bi-link-45deg"></i> Supplier Details</a>
        </li>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="User"><i class="bi bi-person"></i> Users</a>
        </li>
      </ul>
    </div>
    <div class="bottom-links px-3">
      <hr class="text-white" />
      <a class="nav-link" href="settings"><i class="bi bi-gear"></i> Settings</a>
      <a class="nav-link text-danger" href="#" id="signOutBtn"><i class="bi bi-box-arrow-right"></i> Sign Out</a>
    </div>
  </div>

  <div class="main">
    <div class="dashboard-title">👤 User Management</div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="text-dark">User List</h4>
      <button class="btn btn-warning text-dark fw-bold" data-bs-toggle="modal" data-bs-target="#addUserModal">
        <i class="bi bi-plus-circle"></i> Add User
      </button>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-hover text-center align-middle bg-white">
        <thead>
          <tr>
            <th>User ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Password</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1001 <button class="btn btn-sm btn-outline-info ms-2" data-bs-toggle="collapse"
                data-bs-target="#userDetails1" aria-expanded="false" aria-controls="userDetails1"><i
                  class="bi bi-plus-circle"></i></button></td>
            <td>Jane Doe</td>
            <td>jane@example.com</td>
            <td>Owner</td>
            <td>admin123</td>
            </td>
            <td><span class="badge bg-success">Active</span></td>
            <td>
              <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#editUserModal"><i
                  class="bi bi-pencil-square"></i></button>
              <button class="btn btn-sm btn-danger ms-2"><i class="bi bi-trash"></i></button>
            </td>
          </tr>

          <tr class="collapse bg-light" id="userDetails1">
            <td colspan="8" class="text-start">
              <strong>Created At:</strong> 2024-09-01 09:00 AM
            </td>
          </tr>

        </tbody>
      </table>
    </div>
  </div>

  <!-- Add User Modal -->
  <div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content">
        <div class="modal-header bg-warning">
          <h5 class="modal-title" id="addUserLabel">Add User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="text" class="form-control mb-2" placeholder="Full Name" required>
          <input type="email" class="form-control mb-2" placeholder="Email" required>
          <input type="password" class="form-control mb-2" placeholder="Password" required>
          <select class="form-select mb-2" required>
            <option selected disabled>Select Role</option>
            <option>Owner</option>
            <option>Manager</option>
            <option>Employee</option>
          </select>
          <select class="form-select mb-2" required>
            <option selected disabled>Status</option>
            <option>Active</option>
            <option>Inactive</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Add User</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit User Modal -->
  <div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="editUserLabel">Edit User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="text" class="form-control mb-2" placeholder="Full Name" required>
          <input type="email" class="form-control mb-2" placeholder="Email" required>
          <input type="password" class="form-control mb-2" placeholder="Password" required>
          <select class="form-select mb-2" required>
            <option selected disabled>Select Role</option>
            <option>Owner</option>
            <option>Manager</option>
            <option>Employee</option>
          </select>
          <select class="form-select mb-2" required>
            <option selected disabled>Status</option>
            <option>Active</option>
            <option>Inactive</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const userTableBody = document.querySelector("tbody");
      const addUserForm = document.querySelector("#addUserModal form");
      const editUserForm = document.querySelector("#editUserModal form");

      let currentEditUserId = null;

      // 1. Fetch and display users
      function fetchUsers() {
        fetch('/api/users')
          .then(response => response.json())
          .then(users => {
            userTableBody.innerHTML = "";
            users.forEach(user => {
              userTableBody.innerHTML += `
                <tr>
                    <td>${user.UserID}</td>
                    <td>${user.Username}</td>
                    <td>${user.Email}</td>
                    <td>${user.Role}</td>
                    <td>${user.Password}</td>
                    <td><span class="badge ${user.Status === 'Active' ? 'bg-success' : 'bg-secondary'}">${user.Status}</span></td>
                    <td>
                        <button class="btn btn-sm btn-primary edit-btn" data-id="${user.UserID}"><i class="bi bi-pencil-square"></i></button>
                        <button class="btn btn-sm btn-danger delete-btn" data-id="${user.UserID}"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
              `;
            });
          });
      }

      fetchUsers();  // Initial load

      // 2. Add User
      addUserForm.addEventListener("submit", function (e) {
        e.preventDefault();
        const inputs = addUserForm.querySelectorAll("input, select");
        const userData = {
          Username: inputs[0].value,
          Email: inputs[1].value,
          Password: inputs[2].value,
          Role: inputs[3].value,
          Status: inputs[4].value
        };

        fetch('/api/add-user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(userData)
        })
          .then(response => response.json())
          .then(data => {
            fetchUsers();
            const modal = bootstrap.Modal.getInstance(document.getElementById('addUserModal'));
            modal.hide();
            addUserForm.reset();
          });
      });

      // 3. Edit User (populate and show modal)
      userTableBody.addEventListener("click", function (e) {
        if (e.target.closest(".edit-btn")) {
          const userId = e.target.closest(".edit-btn").dataset.id;
          currentEditUserId = userId;

          fetch(`/api/users`)
            .then(response => response.json())
            .then(users => {
              const user = users.find(u => u.UserID == userId);
              const inputs = editUserForm.querySelectorAll("input, select");
              inputs[0].value = user.Username;
              inputs[1].value = user.Email;
              inputs[2].value = user.Password;
              inputs[3].value = user.Role;
              inputs[4].value = user.Status;

              // 🟢 Show the modal
              const modal = new bootstrap.Modal(document.getElementById('editUserModal'));
              modal.show();
            });
        }
      });

      // 4. Submit update
      editUserForm.addEventListener("submit", function (e) {
        e.preventDefault();
        const inputs = editUserForm.querySelectorAll("input, select");

        const userData = {
          Username: inputs[0].value,
          Email: inputs[1].value,
          Password: inputs[2].value,
          Role: inputs[3].value,
          Status: inputs[4].value
        };

        fetch(`/api/update-user/${currentEditUserId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(userData)
        })
          .then(response => response.json())
          .then(data => {
            fetchUsers();
            const modal = bootstrap.Modal.getInstance(document.getElementById('editUserModal'));
            modal.hide();
          });
      });

      // 5. Delete User
      userTableBody.addEventListener("click", function (e) {
        if (e.target.closest(".delete-btn")) {
          const userId = e.target.closest(".delete-btn").dataset.id;
          if (confirm("Are you sure you want to delete this user?")) {
            fetch(`/api/delete-user/${userId}`, {
              method: 'DELETE'
            })
              .then(response => response.json())
              .then(data => {
                fetchUsers();
              });
          }
        }
      });
    });
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const signOutBtn = document.getElementById('signOutBtn');
      if (signOutBtn) {
        signOutBtn.addEventListener('click', (e) => {
          e.preventDefault();

          // 1. Clear any session/local storage (tokens, user info)
          localStorage.clear();
          sessionStorage.clear();

          // 2. Directly redirect to login page (no backend call)
          window.location.href = '/';  // Adjust this path if your login page is different
        });
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
